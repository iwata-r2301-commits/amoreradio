<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アモーレ深夜便 | お便り投稿フォーム</title>
  <style>
    :root {
      --bg-dark: #050a14;
      --panel-bg: #0a1628;
      --neon-cyan: #00f3ff;
      --neon-turquoise: #1de9b6;
      --neon-pink: #ff3b9a;
      --text-main: #e0f7fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.16) 0%, transparent 60%),
        radial-gradient(circle at 85% 90%, rgba(255, 59, 154, 0.08) 0%, transparent 50%),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* オープニングアイキャッチ画面 */
    #opening-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      animation: fadeOutScreen 0.8s ease-in-out 2.4s forwards;
      pointer-events: none;
    }

    .logo-container {
      text-align: center;
      animation: logoZoomIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-container img {
      width: 100%;
      max-width: 320px;
      height: auto;
      filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.55));
    }

    .tuning-bar {
      width: 200px;
      height: 3px;
      background: rgba(0, 243, 255, 0.2);
      margin-top: 20px;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .tuning-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -50%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink));
      animation: scan 1.4s linear infinite;
    }

    /* メインのレトロフューチャー・ラジオ本体 */
    .radio-deck {
      width: 100%;
      max-width: 440px;
      background: var(--panel-bg);
      border: 2px solid var(--neon-cyan);
      border-radius: 20px;
      padding: 22px 20px 26px;
      box-shadow: 
        0 0 28px rgba(0, 243, 255, 0.25),
        inset 0 0 20px rgba(0, 243, 255, 0.1);
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInDeck 0.8s ease-out 2.6s forwards;
    }

    .deck-logo {
      text-align: center;
      margin-bottom: 12px;
    }

    .deck-logo img {
      max-width: 185px;
      height: auto;
      filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.45));
    }

    .radio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(0, 243, 255, 0.25);
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      padding: 12px 0;
      margin-bottom: 22px;
    }

    .frequency-display {
      font-family: monospace;
      color: var(--neon-turquoise);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .frequency-scale {
      display: flex;
      gap: 4px;
      margin-top: 5px;
    }

    .frequency-scale span {
      display: block;
      width: 2px;
      height: 7px;
      background: rgba(0, 243, 255, 0.35);
    }

    .frequency-scale span.active {
      height: 11px;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    /* ON AIR ランプ */
    .on-air-badge {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      white-space: nowrap;
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
    }

    .on-air-badge.lit {
      color: #fff;
      border-color: var(--neon-pink);
      background: rgba(255, 59, 154, 0.25);
      text-shadow: 0 0 8px var(--neon-pink);
      box-shadow: 0 0 16px var(--neon-pink), inset 0 0 10px var(--neon-pink);
      animation: pulseLamp 1s infinite alternate;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--neon-turquoise);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }

    label span {
      font-size: 0.72rem;
      font-weight: normal;
      color: rgba(0, 243, 255, 0.65);
      letter-spacing: 0.08em;
    }

    input[type="text"],
    textarea {
      width: 100%;
      background: rgba(4, 9, 18, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 10px;
      padding: 13px 14px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]::placeholder,
    textarea::placeholder {
      color: rgba(224, 247, 250, 0.4);
      font-size: 0.92rem;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 14px rgba(0, 243, 255, 0.45);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.6;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.28), rgba(29, 233, 182, 0.28));
      border: 1.5px solid var(--neon-cyan);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 16px rgba(0, 243, 255, 0.25);
    }

    .submit-btn:hover:not(:disabled),
    .submit-btn:active:not(:disabled) {
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.45), rgba(29, 233, 182, 0.45));
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.65);
    }

    .status-message {
      margin-top: 14px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--neon-turquoise);
      min-height: 1.4em;
      text-shadow: 0 0 8px rgba(29, 233, 182, 0.5);
    }

    @keyframes logoZoomIn {
      0% { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes scan {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    @keyframes fadeOutScreen {
      to { opacity: 0; visibility: hidden; }
    }

    @keyframes fadeInDeck {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseLamp {
      from { box-shadow: 0 0 10px var(--neon-pink); }
      to { box-shadow: 0 0 24px var(--neon-pink), 0 0 6px #fff; }
    }
  </style>
</head>
<body>

  <!-- オープニング演出 -->
  <div id="opening-screen">
    <div class="logo-container">
      <img src="logo.PNG" alt="アモーレ深夜便">
    </div>
    <div class="tuning-bar"></div>
  </div>

  <!-- お便り投稿デッキ -->
  <main class="radio-deck">
    <div class="deck-logo">
      <img src="logo.PNG" alt="アモーレ深夜便">
    </div>

    <div class="radio-header">
      <div>
        <div class="frequency-display">AMORE MIDNIGHT // ON AIR</div>
        <div class="frequency-scale">
          <span></span><span></span><span class="active"></span><span></span><span></span>
          <span></span><span class="active"></span><span></span><span></span><span></span>
        </div>
      </div>
      <div id="on-air-lamp" class="on-air-badge">ON AIR</div>
    </div>

    <form id="letter-form" action="https://formsubmit.co" method="POST">
      <input type="hidden" name="_subject" value="【アモーレ深夜便】新しいお便りが届きました！">
      <input type="hidden" name="_template" value="table">

      <div class="form-group">
        <label for="nickname">ニックネーム <span>RADIO NAME</span></label>
        <input type="text" id="nickname" name="name" placeholder="例：深夜のリスナー" required>
      </div>

      <div class="form-group">
        <label for="message">お便り内容 <span>MESSAGE</span></label>
        <textarea id="message" name="message" placeholder="配信で読んでほしいメッセージや質問を書いてね！" required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="submit-btn">お便りを送信する</button>
      <div id="status-msg" class="status-message"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('letter-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');
    const onAirLamp = document.getElementById('on-air-lamp');

    form.addEventListener('submit', () => {
      submitBtn.textContent = "送信中...";
      onAirLamp.classList.add('lit');
      statusMsg.textContent = "電波に乗せて送信しています...";
    });
  </script>
</body>
</html>
